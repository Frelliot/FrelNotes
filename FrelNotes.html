<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заметки</title>
<meta name="color-scheme" content="only light"><meta name="theme-color" content="#f5f3ee">
<script>try{var _s=JSON.parse(localStorage.getItem("nt1set"))||{},_t=_s.th;if(_t!=="light"&&_t!=="dark"&&_t!=="oled")_t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",_t);document.querySelector("meta[name=color-scheme]").content=_t==="light"?"only light":"dark"}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{--ui:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;--bg:#f5f3ee;--sf:#fffefb;--tx:#23211e;--mu:#7a756c;--bd:#e4e0d6;--ac:#23211e;--ac2:#ece8df;--cd:#ebe7de;--k:#a23f5e;--s:#3f7350;--n:#a4691a;--tl:30%;
color-scheme:only light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"],:root[data-theme="oled"]{--bg:#111;--sf:#1a1a1a;--tx:#ececec;--mu:#8f8f8f;--bd:#2e2e2e;--ac:#ececec;--ac2:#262626;--cd:#232323;--k:#d07c96;--s:#85b392;--n:#d8a45a;--tl:78%;color-scheme:dark}
:root[data-theme="oled"]{--bg:#000;--sf:#0b0b0b;--bd:#262626;--ac2:#171717;--cd:#161616}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.7 "Lora",Georgia,"Iowan Old Style",serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--bg)}
header button,#tb button{font:inherit;border:0;background:var(--cd);color:var(--tx);border-radius:14px;min-width:42px;height:40px;padding:0 12px;cursor:pointer;font-weight:600}
#grp{flex:1;min-width:0;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:14px;height:40px;padding:0 12px;font:inherit;font-size:14px}
#st{font-size:12px;color:var(--mu);min-width:62px;text-align:right}
main{flex:1;overflow-y:auto;padding:18px 18px 40px}
#doc{max-width:760px;margin:0 auto}
.blk{border-radius:14px;padding:2px 8px;margin:0 -8px;min-height:1.65em}
.blk:not(.ed):hover{background:var(--cd)}
.blk textarea{width:100%;border:0;outline:0;resize:none;background:var(--ac2);color:var(--tx);font:14.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 10px;border-radius:8px;display:block;overflow:hidden}
.add{min-height:50vh;color:var(--mu);padding:8px}
.blk>*:first-child,.blk>.dh+*{margin-top:.3em}.blk>*:last-child{margin-bottom:.3em}
h1,h2,h3,h4{line-height:1.25;margin:.6em 0 .3em}h1{font-size:1.9em}h2{font-size:1.5em}h3{font-size:1.2em}
blockquote{margin:.5em 0;padding:.1em 1em;border-left:4px solid var(--ac);color:var(--mu);background:var(--cd);border-radius:0 8px 8px 0}
a{color:var(--ac)}hr{border:0;border-top:2px solid var(--bd)}
code{background:var(--cd);padding:.1em .35em;border-radius:5px;font-size:.9em;font-family:ui-monospace,Menlo,monospace}
pre{background:var(--cd);padding:12px 14px;border-radius:12px;overflow-x:auto;margin:.5em 0}pre code{background:none;padding:0;font-size:13.5px;line-height:1.5}
:is(pre,code) .k{color:var(--k)}:is(pre,code) .s{color:var(--s)}:is(pre,code) .n{color:var(--n)}:is(pre,code) .c{color:var(--mu);font-style:italic}
.tw{overflow-x:auto;margin:.5em 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bd);padding:6px 12px;text-align:left}th{background:var(--cd)}
ul,ol{padding-left:1.4em;margin:.3em 0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:1.2em;height:1.2em;border:2px solid var(--mu);border-radius:6px;vertical-align:-.2em;margin:0 .5em 0 0;cursor:pointer;position:relative}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:.3em;top:.08em;width:.28em;height:.55em;border:solid var(--acf,var(--bg));border-width:0 2px 2px 0;transform:rotate(45deg)}
li:has(>input[type=checkbox]){list-style:none;margin-left:-1.3em}li:has(>input:checked){opacity:.55;text-decoration:line-through}
.pb{display:flex;align-items:center;gap:10px;margin:.4em 0}.pl{min-width:0;flex:0 1 auto}
.pt{flex:1;height:12px;background:var(--cd);border-radius:9px;overflow:hidden;cursor:ew-resize;touch-action:none;box-shadow:inset 0 0 0 1px var(--bd);min-width:60px}
.pf{display:block;height:100%;background:var(--c);border-radius:9px;transition:background .2s}.pv{font-size:13px;color:var(--mu);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.mth.d{display:block;text-align:center;margin:.5em 0;overflow-x:auto}math{font-size:1.15em}
#tb{background:var(--sf);border-radius:22px 22px 0 0;box-shadow:0 -4px 24px #00000026;border-top:1px solid var(--bd);padding:4px 10px}
#tb .row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}#tb .row::-webkit-scrollbar{display:none}
#tb.c .row{display:none}#tb button{flex:none}
#tb.c #tg{transform:rotate(180deg)}
#dr{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:none}#dr.o{display:block}
#dr .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:#0006}
#dr .pn{position:absolute;left:0;top:0;bottom:0;width:min(86vw,340px);background:var(--sf);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#dr .hd{display:flex;gap:8px;padding:12px}#q{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:0 12px;font:inherit;font-size:14px}
#nn{border:0;background:var(--ac);color:var(--acf,var(--bg));border-radius:14px;font-weight:700;padding:0 14px;font:inherit;cursor:pointer}
#ls{flex:1;overflow-y:auto;padding:0 8px 16px}
.g{padding:10px 8px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);cursor:pointer;user-select:none}
.it{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer}.it:hover,.it.a{background:var(--cd)}
.it .b{flex:1;min-width:0}.it b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{border:0;background:none;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.it button.x{flex:none;width:30px;height:30px;padding:0;border-radius:9px;background:var(--bd);color:var(--mu);font-size:14px;line-height:1;transition:background .15s,color .15s}
.it button.x.arm{background:#d9473d;color:#fff}
header,#tb,#dr{font-family:var(--ui)}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
.blk textarea{border-radius:12px}
::selection{background:#88888855}
#doc{max-width:calc(var(--mw,760px) + 28px);padding-left:28px;font-size:calc(17px*var(--fs,1));line-height:var(--lh,1.7);font-family:var(--ff,"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif)}
.blk textarea{font-size:calc(14.5px*var(--fs,1))}
#se{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:none;font-family:var(--ui)}#se.o{display:block}
#se .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:#0006}
#se .sh{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);max-height:84vh;overflow-y:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px #0003}
#se h3{margin:0 0 6px;font-size:18px}
#se .rg,#se .r{padding:12px 0;border-bottom:1px solid var(--bd);font-size:15px}
#se .r{display:flex;align-items:center;justify-content:space-between;gap:12px}
#se .rh{display:flex;justify-content:space-between;margin-bottom:8px}#se .rh b{color:var(--mu);font-weight:600}
#se input[type=range]{width:100%;accent-color:var(--ac)}
.sg{display:flex;background:var(--cd);border-radius:12px;padding:3px}
.sg button{border:0;background:none;color:var(--mu);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer}
.sg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px #0002}
.ab{flex:1;border:0;background:var(--cd);color:var(--tx);font:inherit;font-size:14px;font-weight:600;border-radius:12px;height:40px;cursor:pointer}

.blk{position:relative}
.dh{position:absolute;left:-24px;top:2px;width:24px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--mu);opacity:.55;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font:700 15px/1 var(--ui);letter-spacing:-3px;border-radius:8px}
.dh:hover{opacity:1;background:var(--cd)}
.blk.dg{z-index:5;background:var(--sf);box-shadow:0 10px 28px #0000003d;transition:none;user-select:none;-webkit-user-select:none}
.dh:active{cursor:grabbing}
.blk.dsh{transition:transform .2s cubic-bezier(.2,.8,.2,1);will-change:transform}
.blk.dg{will-change:transform;touch-action:none}
.blk.dg.dsh{z-index:5}
body.ro #tb{display:none}
body.ro .blk:not(.ed):hover{background:none}
body.ro .pt{cursor:default}
body.ro #ro{background:var(--ac);color:var(--acf,var(--bg))}
#meta{max-width:calc(var(--mw,760px) + 28px);margin:0 auto;padding-left:28px;font-family:var(--ui)}
#ttl{display:block;width:100%;border:0;outline:0;background:none;color:var(--tx);font-weight:700;font-size:calc(26px*var(--fs,1));line-height:1.25;font-family:var(--ff,"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif);padding:2px 0;letter-spacing:-.01em}
#ttl::placeholder{color:var(--mu);opacity:.6}
#ntags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px;min-height:6px}
#ti::-webkit-calendar-picker-indicator{display:none!important}
#ti{border:0;outline:0;background:none;color:var(--tx);font:600 13px var(--ui);width:90px;padding:3px 2px}
.tag{--h:210;display:inline-block;padding:0 .6em;border-radius:99px;font:600 .82em/1.65 var(--ui);background:hsla(var(--h),70%,50%,.16);color:hsl(var(--h),60%,var(--tl,30%));border:1px solid hsla(var(--h),70%,50%,.4);white-space:nowrap;margin:0 .1em;user-select:none;-webkit-user-select:none}
#ntags .tag{cursor:pointer;font-size:13px;margin:0}
body.ro .blk .tag{cursor:pointer}
.tag.auto{border-style:dashed}
.tag.on{background:hsl(var(--h),62%,46%);color:#fff;border-color:transparent}
.tag.sm{font-size:11px;padding:0 .5em;margin:0}
.tag i{font-style:normal;opacity:.65;font-size:.9em}
.tag button{border:0;background:none;color:inherit;font:inherit;padding:0 0 0 .45em;cursor:pointer;opacity:.7}
.tag button:hover{opacity:1}
#tf{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;font-family:var(--ui)}#tf:empty{display:none}#tf .tag{cursor:pointer;font-size:12.5px}
.tl{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.blk img,.blk video{max-width:100%;height:auto;border-radius:12px;display:block;margin:.4em 0}
.blk video{background:#000}.blk audio{width:100%;display:block;margin:.4em 0}
.blk img{cursor:default}body.ro .blk img{cursor:zoom-in}
.mmiss{display:inline-block;padding:.3em .8em;border-radius:10px;background:var(--cd);color:var(--mu);font:13px var(--ui)}
#lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);cursor:zoom-out}#lb.o{display:flex}
#lb img{max-width:96vw;max-height:92vh;border-radius:8px}

/* светлая тема: мягкие тени и акценты */
:root[data-theme="light"] #tb{box-shadow:0 -6px 24px #3b2f1a14;border-top-color:transparent}
:root[data-theme="light"] .blk.dg{box-shadow:0 12px 30px #3b2f1a26,0 0 0 1px var(--bd)}
:root[data-theme="light"] #se .sh{box-shadow:0 -8px 32px #3b2f1a1f}
:root[data-theme="light"] header button,:root[data-theme="light"] #tb button{box-shadow:0 1px 0 #fff inset,0 1px 2px #3b2f1a14}
:root[data-theme="light"] #grp,:root[data-theme="light"] #q{box-shadow:0 1px 2px #3b2f1a0d}
:root[data-theme="light"] .blk:not(.ed):hover{background:#3b2f1a0b}
:root[data-theme="light"] .sg button.on{box-shadow:0 1px 3px #3b2f1a26}
:root[data-theme="light"] pre{background:#efebe2}
:root[data-theme="light"] .it:hover,:root[data-theme="light"] .it.a{background:#3b2f1a0e}
:root[data-theme="light"] input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
/* акцент */
blockquote{background:color-mix(in srgb,var(--ac) 9%,var(--sf))}
::selection{background:color-mix(in srgb,var(--ac) 25%,transparent)}
.blk textarea{caret-color:var(--ac)}
.sw{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.sw button{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--bd)}
.sw button.on{box-shadow:0 0 0 2px var(--sf),0 0 0 4px var(--tx)}
/* отмена / повтор, уведомление */
#tbh{display:flex;align-items:center;gap:6px;padding:2px 0 0}
#tbh .ur{display:flex;gap:4px}
#tb #tbh .ur button,#tb #tg{width:36px;min-width:0;height:32px;padding:0;border-radius:10px;font-size:17px;line-height:1}
#tb #tg{background:none;color:var(--mu);box-shadow:none}
#tbh button:disabled{opacity:.3;cursor:default}
#tabs{flex:1;display:flex;gap:2px;background:var(--cd);border-radius:12px;padding:2px;min-width:0}
#tb #tabs button{flex:1;min-width:0;height:28px;padding:0 2px;border-radius:10px;background:none;color:var(--mu);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:none;transition:background .15s,color .15s}
#tb #tabs button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px #0002}
#tb .row{gap:6px;padding:6px 0 4px;overflow:hidden}
#tb .row button{flex:1 1 0;min-width:0;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 2px;border-radius:12px;font-size:17px;line-height:1;transition:background .12s,color .12s,transform .1s}
#tb .row button:active{transform:scale(.93)}
#tb .row button small{font:600 9.5px/1 var(--ui);color:var(--mu);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb .row button.on{background:var(--ac);color:var(--acf,var(--bg))}
#tb .row button.on small{color:inherit;opacity:.85}
#tb .row.sw{animation:tin .16s ease}
@keyframes tin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;display:flex;align-items:center;gap:14px;background:var(--ac);color:var(--acf,var(--bg));padding:10px 16px;border-radius:14px;font:600 14px var(--ui);max-width:92vw;box-shadow:0 6px 24px #0004}
#toast.o{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
/* плавная смена темы */
html.nt,html.nt *,html.nt *::before,html.nt *::after{transition:none!important}
/* анимации панелей */
#dr,#se{display:block!important;visibility:hidden;pointer-events:none;transition:visibility 0s linear .22s}
#dr.o,#se.o{visibility:visible;pointer-events:auto;transition-delay:0s}
#dr .bg,#se .bg{opacity:0;transition:opacity .2s ease}
#dr.o .bg,#se.o .bg{opacity:1}
#dr .pn{transform:translateX(-102%);transition:transform .22s cubic-bezier(.22,.9,.3,1);will-change:transform}
#dr.o .pn{transform:none}
#se .sh{transform:translate(-50%,102%);transition:transform .24s cubic-bezier(.22,.9,.3,1);will-change:transform}
#se.o .sh{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#dr,#se,#dr *,#se *{transition-duration:.01s!important}}

/* живое редактирование кода и таблиц */
.ce{position:relative;margin:.5em 0;background:var(--cd);border-radius:12px}
.ce pre,.blk .ce textarea{font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px 14px;margin:0;border:0;border-radius:12px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;letter-spacing:0;text-align:left}
.ce pre{position:relative;background:none;overflow:hidden;pointer-events:none;min-height:3em}
.blk .ce textarea{position:absolute;top:0;left:0;width:100%;height:100%!important;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--tx);resize:none;overflow:hidden}
.tw [contenteditable]{outline:0;cursor:text;height:2.4em;min-width:3em}
.tw [contenteditable]:focus{background:color-mix(in srgb,var(--ac) 12%,transparent);box-shadow:inset 0 0 0 2px var(--ac)}
.tctl{display:none;gap:6px;flex-wrap:wrap;margin:.2em 0 .6em;font-family:var(--ui)}
.blk:focus-within .tw+.tctl{display:flex}
.tctl button{font:600 12px var(--ui);border:0;background:var(--cd);color:var(--tx);border-radius:10px;height:30px;padding:0 11px;cursor:pointer;line-height:1}
.tctl button:active{transform:scale(.95)}

/* подсветка инлайн-кода при наборе + свайп-удаление */
.ce.tx{background:var(--ac2);margin:0}
.ce.tx pre,.blk .ce.tx textarea{font:calc(14.5px*var(--fs,1))/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 10px}
.ce.tx pre{min-height:calc(1.6*14.5px*var(--fs,1) + 16px)}
.ic{background:color-mix(in srgb,var(--tx) 10%,transparent);border-radius:4px}
.bt{opacity:.45}
#mainc{overflow-x:hidden}

/* полноэкранный браузер заметок */
#dr .bg{display:none}
#dr .pn{width:100%;right:0;background:var(--bg);transform:translateY(16px);opacity:0;transition:transform .22s cubic-bezier(.22,.9,.3,1),opacity .18s ease}
#dr.o .pn{transform:none;opacity:1}
#dr .hd,#dr .tb2,#tf{padding-left:max(14px,calc((100% - 1100px)/2));padding-right:max(14px,calc((100% - 1100px)/2))}
#dr .hd{padding-top:12px;padding-bottom:8px;align-items:center}
#dr .tb2{display:flex;gap:8px;align-items:center;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
#dr .tb2::-webkit-scrollbar{display:none}#dr .tb2>*{flex:none}
#cnt{color:var(--mu);font-size:13px;font-weight:600;white-space:nowrap}.spc{flex:1!important;min-width:4px}
.cb{border:0;background:var(--cd);color:var(--tx);border-radius:14px;min-width:42px;height:40px;font:600 15px var(--ui);cursor:pointer;padding:0 12px}
.cb.on{background:var(--ac);color:var(--acf,var(--bg))}
#nn{height:40px}
#tf{padding-top:0;padding-bottom:10px}
#ls{padding:2px max(14px,calc((100% - 1100px)/2)) 110px}
.gh{padding:16px 2px 8px;font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);cursor:pointer;user-select:none}
.gh:first-child{padding-top:6px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lst{display:flex;flex-direction:column;gap:8px}
.nc{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:16px;cursor:pointer;overflow:hidden;font-family:var(--ui);transition:border-color .15s,box-shadow .15s,transform .12s}
.nc:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.nc:active{transform:scale(.995)}
.nc.a{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.nc.s{box-shadow:0 0 0 2px var(--ac);border-color:var(--ac)}
.nc .bd{padding:12px 14px;min-width:0;flex:1}

const WEL=`Нажмите на любой блок, чтобы изменить его. Блок — это абзац, заголовок, список, таблица и т. д.; блоки разделяются пустой строкой. Нажмите Esc или вне блока, чтобы закончить правку. Всё сохраняется автоматически.

## Управление блоками
- Потяните за ⋮⋮ слева вверх или вниз, чтобы переместить блок
- Потяните ⋮⋮ вправо, чтобы удалить блок (можно отменить)
- Кнопка ✎ в шапке включает режим чтения: правка выключена, а галочки, прогресс, таймеры и группы остаются рабочими
- Ctrl+Z / Ctrl+Y или стрелки ↶ ↷ в тулбаре — отмена и повтор

## Тулбар
Внизу четыре вкладки; их можно листать свайпом, а ⌃ сворачивает панель.
- **Текст** — заголовки, жирный, курсив, зачёркнутый
- **Блоки** — списки, задачи, цитата, код, таблица, формула
- **Инлайн** — ссылка, код в строке, формула в строке, тег
- **Ещё** — прогресс, группа, таймер, фото, аудио, видео, линия

## Чек-лист
- [x] Нажимайте на галочки

## Прогресс
Кнопка «Прогресс» сразу открывает выбор цвета. Полосу можно тянуть пальцем, а нажатие на проценты справа меняет её цвет. Вариант «Авто» плавно меняет цвет от красного к зелёному.

## Группы
Группа состоит из блока начала, блоков внутри и блока конца. Нажмите ▾ в шапке, чтобы свернуть, на цветную точку — чтобы выбрать цвет (в режиме редактирования). Группы можно вкладывать друг в друга, а блоки переносить внутрь и наружу за ⋮⋮. Кнопка «Группа» вставляет все три блока сразу.

## Таймеры и будильники
Кнопка «Таймер» на вкладке «Ещё» открывает меню: таймер на заданное время или будильник на время суток. Нажмите на цифры, чтобы изменить время (подойдёт \`5\`, \`10м\`, \`1ч 30м\`, \`2:30\`). Сигнал сработает в любой заметке, пока страница открыта; кнопки «Стоп» и «+5 мин» появятся сверху.

## Теги
Теги пишутся прямо в тексте: #идея #работа #личное. Нажмите на тег под названием, чтобы сменить цвет, или добавьте его кнопкой «+ тег». В режиме чтения нажатие на тег покажет все заметки с ним.

## Таблица
Ячейки правятся прямо в таблице: Tab и Enter переходят дальше, кнопки под таблицей добавляют и убирают строки и столбцы.

| Функция | Статус |
|---|---|
| Markdown | есть |
| LaTeX | есть |
| Таймеры | есть |

## Фото, аудио и видео
Добавляются кнопками ▣ ♪ ▷, перетаскиванием файла на страницу или вставкой из буфера. Файлы хранятся в браузере; в режиме чтения фото открываются во весь экран.

## Все заметки
Кнопка ☰ (или Ctrl+K) открывает список всех заметок.
- Поиск по тексту и тегам, фильтр по тегу
- Сортировка: по изменению, по созданию, по алфавиту; вид — список или плитки
- Поле «Группа…» в шапке собирает заметки в папки, а кнопка «Группы» включает или выключает такое разделение
- Звёздочка закрепляет заметку, ⧉ дублирует, ✕ (нажать дважды) удаляет
- Долгое нажатие на заметку или кнопка ☑ включают выбор нескольких: закрепить, переместить в группу, удалить

## Настройки
Кнопка ⚙ открывает размер текста, интервал, ширину, шрифт, тему (авто, светлая, тёмная, OLED), акцентный цвет или свой HEX, поведение тулбара, экспорт и импорт заметок вместе с медиа, копирование в Markdown и сброс.
